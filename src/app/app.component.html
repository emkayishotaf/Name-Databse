<main class="main-stage">
    <!-- Desktop Setup (Monitor + Stand + Peripherals) -->
    <div class="retro-setup-wrapper">
        <!-- 1. Retro Virtual Monitor Component -->
        <app-monitor></app-monitor>

        <!-- 2. Monitor Stand -->
        <div class="monitor-stand-neck"></div>
        <div class="monitor-stand-base"></div>

        <!-- 3. Desktop Keyboard & Mouse Mockup -->
        <div class="desktop-accessories">
            <!-- Keyboard Mockup -->
            <div class="keyboard-mock">
                <div class="keyboard-keys">
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
            
            <!-- Mouse Mockup with Cable -->
            <div class="mouse-wrapper">
                <div class="mouse-cable"></div>
                <div class="mouse-mock">
                    <div class="mouse-scroll"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. Supabase Integration Panel Component -->
    <app-database-log></app-database-log>
</main>
